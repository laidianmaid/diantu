services:
  caddy:
    build: ./caddy-docker  # 指向刚才创建的文件夹
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    environment:
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

  db:
    image: postgis/postgis:16-3.4
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: always
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        # 将环境中的变量传给 Docker build
        VITE_AMAP_JS_KEY: ${VITE_AMAP_JS_KEY}
        VITE_EDGE_MODEL_URLS: ${VITE_EDGE_MODEL_URLS:-}
        VITE_EDGE_MODEL_SIZE_BYTES: ${VITE_EDGE_MODEL_SIZE_BYTES:-3416118240}
    restart: always

  bot:
    build: ./bot
    restart: always
    env_file: .env
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
  caddy_data:
  caddy_config:
